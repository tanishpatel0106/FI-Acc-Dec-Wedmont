[project]
name = "lifecycle"
version = "0.1.0"
description = "LIFECYCLE: multi-asset portfolio optimization and lifetime utility research engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "statsmodels>=0.14",
    "arch>=7.0",
    "scikit-learn>=1.5",
    "numba>=0.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "xlrd>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
wrds = ["wrds>=3.2", "psycopg2-binary>=2.9"]
workers = ["arq>=0.26", "redis>=5.0"]
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.11", "ruff>=0.6", "pandas-stubs", "types-requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lifecycle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B905", "B007"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "lifecycle.engine.*"
strict = true
disallow_untyped_calls = false
warn_return_any = false
